[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-3pin-detector"
version = "0.1.0"
description = "POC X-ray 3-pin/JIG/V-hole inference pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "onnxruntime>=1.16",
  "Pillow>=10.0",
]

[project.optional-dependencies]
training = [
  "torch",
  "timm",
  "tqdm",
  "ultralytics",
  "onnx",
  "onnxruntime",
  "opencv-python",
  "numpy",
]

[project.scripts]
xray-3pin-infer = "xray_3pin_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
